<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carlos Mena</title>
  <meta name="description" content="Carlos Mena — Próximamente" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      width: 60vw;
      height: 60vw;
      max-width: 700px;
      max-height: 700px;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }

    .content {
      position: relative;
      text-align: center;
      padding: 2rem;
      z-index: 1;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeInUp 0.9s ease forwards;
    }

    p.subtitle {
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #999;
      opacity: 0;
      animation: fadeInUp 0.9s ease 0.2s forwards;
      margin-bottom: 2.5rem;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dots span {
      display: inline-block;
      animation: blink 1.4s infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    .social {
      opacity: 0;
      animation: fadeInUp 0.9s ease 0.4s forwards;
    }

    .social a {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      color: #999;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      padding: 0.6rem 1.1rem;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .social a:hover {
      color: #f5f5f5;
      border-color: #0a66c2;
      background: rgba(10, 102, 194, 0.08);
    }

    .social svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="content">
    <h1>Carlos Mena</h1>
    <p class="subtitle">Coming soon<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    <div class="social">
      <a href="https://www.linkedin.com/in/carlos-javier-m-0b608691/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn de Carlos Mena">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        <span>LinkedIn</span>
      </a>
    </div>
  </div>
</body>
</html>
